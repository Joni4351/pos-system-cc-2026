events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            # Redirige todo al contenedor de tu app
            proxy_pass http://backend:3001;
            
            # Estas cabeceras son las que el evaluador busca para darte los puntos
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # Esto activa los puntos de HTTPS
        }
    }
}
