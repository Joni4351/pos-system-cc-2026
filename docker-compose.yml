version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend-app
    env_file:
      - ./backend/.env
    expose:
      - "3001"

  # Este es el Reverse Proxy que te dará los puntos
  proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
